name: arrowchime
description: "Arrowchime: Arrow Escape Puzzle — a premium arrow-escape puzzle game (Android + iOS)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  app_tracking_transparency: ^2.0.7
  audio_session: ^0.2.4
  connectivity_plus: ^7.3.2
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_soloud: ^5.1.6
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  google_mobile_ads: ^9.1.0
  hive_ce: ^2.20.2
  hive_ce_flutter: ^2.4.0
  in_app_purchase: ^3.3.1
  in_app_review: ^2.0.12
  intl: ^0.20.3
  json_annotation: ^4.12.0
  meta: ^1.19.0
  package_info_plus: ^10.2.2
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.16.1
  fake_async: ^1.3.3
  flame_test: ^2.3.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: false
  generate: true

  assets:
    - assets/levels/
    - assets/branding/
    - assets/audio/music/
    - assets/audio/notes/celesta/
    - assets/audio/notes/choir/
    - assets/audio/notes/harp/
    - assets/audio/notes/kalimba/
    - assets/audio/notes/marimba/
    - assets/audio/notes/musicbox/
    - assets/audio/notes/piano/
    - assets/audio/notes/pixel/
    - assets/audio/notes/santoor/
    - assets/audio/sfx/
    - assets/images/
    - assets/images/chapters/ch1/
    - assets/images/chapters/ch2/
    - assets/images/chapters/ch3/
    - assets/images/chapters/ch4/
    - assets/images/chapters/ch5/
    - assets/images/cosmetics/
    - assets/images/mechanics/
    - assets/images/ui/
    - assets/lottie/
    - assets/rive/
    - assets/shaders/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
