name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - name: Pure-Dart guard (lib/core/level must not import Flutter)
        run: |
          if grep -rn "package:flutter" lib/core/level/ 2>/dev/null; then
            echo "lib/core/level must stay pure Dart"; exit 1
          fi
      - run: flutter test
      - name: Verify shipped levels
        run: dart run tool/level_check.dart assets/levels/
      - name: Level generation is deterministic (same seed, identical pack)
        run: |
          dart run tool/level_gen.dart --chapter 1 --count 60 --seed 1001 --out "$RUNNER_TEMP/ch1.json"
          diff "$RUNNER_TEMP/ch1.json" assets/levels/ch1.json
          dart run tool/level_gen.dart --chapter 4 --count 60 --seed 1001 --out "$RUNNER_TEMP/ch4.json"
          diff "$RUNNER_TEMP/ch4.json" assets/levels/ch4.json
      - name: Placeholder assets exist at every manifest path
        run: |
          dart run tool/gen_placeholder_assets.dart
          git diff --exit-code --stat -- assets || (echo "assets changed: commit the placeholders"; exit 1)
          test -z "$(git status --porcelain assets)" || (git status --porcelain assets; exit 1)
      - run: flutter build appbundle --flavor dev -t lib/main_dev.dart

  ios-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --no-codesign --flavor dev -t lib/main_dev.dart
